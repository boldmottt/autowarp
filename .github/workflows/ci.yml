name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "opencv-python-headless<5" Pillow
      - name: 엔진 테스트
        run: python -m unittest discover -s tests -v
      - name: 문법 검사
        run: python -m py_compile core.py cli.py app.py
